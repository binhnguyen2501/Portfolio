<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Nunito,sans-serif;color:#1a1a1a;background:#fff}
.card{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500}
.red{color:#b23d43}
.hello{font-size:44px;font-weight:800;color:#b23d43;line-height:1}
.h{font-weight:900;letter-spacing:-0.045em;line-height:.95}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:22px;color:#3d3d3d}
.tiles{display:flex;gap:12px}
.tile{width:84px;height:84px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tile img{max-width:56%;max-height:56%;object-fit:contain}
.u{position:relative;display:inline-block}
.u svg{position:absolute;left:-2%;bottom:-6%;width:104%;height:18%;overflow:visible}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search).get('page')||'home';
fetch('data.json').then(r=>r.json()).then(P=>{
 const app=document.getElementById('app');
 const tiles=(list,size)=>`<div class="tiles">${list.map(p=>`<div class="tile" style="background:${p.wipe};${size?`width:${size}px;height:${size}px;border-radius:${size*.2}px`:''}"><img src="${p.logo}" style="max-width:${p.scale*120}%;max-height:${p.scale*120}%"></div>`).join('')}</div>`;
 const scribble=`<svg viewBox="0 0 300 20" preserveAspectRatio="none" fill="none"><path d="M3 12 C 46 3, 88 18, 142 10 S 236 3, 297 11" stroke="#b23d43" stroke-width="7" stroke-linecap="round"/></svg>`;
 if(q==='home') app.innerHTML=`<div class="card"><div class="hello">Hello!</div>
  <div class="h" style="font-size:104px;margin-top:22px">I’m a <span class="u">creative${scribble}</span><br>Front-end Developer<br>based in Vietnam<span class="red">.</span></div>
  <div class="foot"><div><div class="mono">Nguyen Binh <span class="red">/</span> Fintech &amp; Web3 <span class="red">/</span> React, Next.js, TypeScript</div><div class="mono" style="color:#646464;margin-top:8px;font-size:19px">binh98.vercel.app</div></div>${tiles(P.slice(0,5),76)}</div></div>`;
 else if(q==='about') app.innerHTML=`<div class="card"><div class="hello">About</div>
  <div style="display:flex;gap:56px;align-items:center;margin-top:26px"><div style="flex:1"><div class="h" style="font-size:112px">Nguyen Binh</div>
  <div style="font-size:40px;font-weight:800;letter-spacing:-.02em;margin-top:18px">Frontend Engineer in Ho Chi Minh City<span class="red">.</span></div></div>
  <div style="width:210px;height:262px;border-radius:28px;overflow:hidden;background:#f7f7f7;flex:none"><img src="/src/assets/images/me.png" style="width:100%;height:100%;object-fit:cover;object-position:50% 22%"></div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid #1a1a1a;margin-top:auto;padding-top:20px">${[['4+','years in fintech &amp; Web3'],['1,000+','daily active users'],['&lt;1 s','portfolio load time'],['60%','fewer production errors']].map(([a,b],i)=>`<div style="${i?'border-left:2px solid #e6e6e6;padding-left:24px':''}"><div class="h" style="font-size:58px">${a}</div><div style="font-size:20px;color:#3d3d3d;margin-top:8px">${b}</div></div>`).join('')}</div></div>`;
 else if(q==='works') app.innerHTML=`<div class="card"><div class="hello">Selected Projects,</div>
  <div class="h" style="font-size:76px;margin-top:20px;max-width:1000px">Dashboards, storefronts, and web apps I’ve built<span class="red">.</span></div>
  <div style="margin-top:auto">${tiles(P,118)}</div>
  <div class="mono" style="font-size:20px;color:#3d3d3d;margin-top:22px">${P.length} case studies <span class="red">/</span> Nguyen Binh <span class="red">/</span> binh98.vercel.app</div></div>`;
 else { const p=P.find(x=>x.slug===q);
  app.innerHTML=`<div class="card" style="background:${p.wipe};padding:60px 0 60px 68px;flex-direction:row;gap:48px">
   <div style="width:500px;flex:none;display:flex;flex-direction:column">
    <div class="mono" style="font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3d3d3d">${String(p.n).padStart(2,'0')} &nbsp;${p.category}</div>
    <div class="h" style="font-size:${p.title.length>11?84:104}px;margin-top:26px;color:${p.ink}">${p.title}</div>
    <div style="font-size:29px;line-height:1.25;font-weight:700;margin-top:24px;color:#1a1a1a">${p.tagline}</div>
    <div style="margin-top:auto;display:flex;align-items:center;gap:16px"><div class="tile" style="background:#fff;width:64px;height:64px;border-radius:14px"><img src="${p.logo}" style="max-width:${p.scale*130}%;max-height:${p.scale*130}%"></div>
     <div><div style="font-size:22px;font-weight:800">Case study by Nguyen Binh</div><div class="mono" style="font-size:18px;color:#3d3d3d;margin-top:2px">${p.role}</div></div></div>
   </div>
   <div style="flex:1;border-radius:22px 0 0 22px;overflow:hidden;box-shadow:0 0 0 2px ${p.ink}22;background:#fff"><img src="${p.poster}" style="width:100%;height:100%;object-fit:cover;object-position:0 0"></div></div>`; }
 document.fonts.ready.then(()=>document.body.setAttribute('data-ready','1'));
});
</script></body></html>
